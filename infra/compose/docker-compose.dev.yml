services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: hadir-postgres
    environment:
      POSTGRES_USER: hadir
      POSTGRES_PASSWORD: hadir
      POSTGRES_DB: hadir
    ports:
      - '5432:5432'
    volumes:
      - hadir_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hadir -d hadir']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    container_name: hadir-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - hadir_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hadir-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - hadir_minio:/data

volumes:
  hadir_pg:
  hadir_redis:
  hadir_minio:
